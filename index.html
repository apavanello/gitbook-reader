<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Leia qualquer repo público em formato GitBook como um livro: sidebar, highlight de código, mermaid, busca e temas."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"
    />
    <title>GitBook Reader</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint para evitar flash.
      try {
        var t = localStorage.getItem("gbr:theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" crossorigin src="./assets/index-D3V40Tqe.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/mermaid-A57IqgOR.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CJ1BJyVu.css">
  </head>

    <div id="root"></div>
  </body>
</html>
