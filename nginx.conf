server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URLs "bonitas" (/github.com/owner/repo, /owner/repo@branch/cap.md)
    # caem no index.html; o app converte para a rota hash no boot.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
